  <script>
    const accessibilityBtn =
      document.getElementById('accessibility-btn');
    const accessibilityPanel =
      document.getElementById('accessibility-panel');

    /* ABRIR PAINEL */
    accessibilityBtn.addEventListener('click', () => {
      accessibilityPanel.style.display =
        accessibilityPanel.style.display === 'block'
          ? 'none'
          : 'block';
    });

    /* FONTE */
    function increaseFont() {
      const elementos = document.querySelectorAll('*');
      elementos.forEach((el) => {
        const estilo = window.getComputedStyle(el);
        const tamanhoAtual =
          parseFloat(estilo.fontSize);
        if (!isNaN(tamanhoAtual)) {
          el.style.setProperty(
            'font-size',
            (tamanhoAtual + 2) + 'px',
            'important'
          );
        }
      });
    }

    function decreaseFont() {
      const elementos = document.querySelectorAll('*');
      elementos.forEach((el) => {
        const estilo = window.getComputedStyle(el);
        const tamanhoAtual =
          parseFloat(estilo.fontSize);
        if (!isNaN(tamanhoAtual)
          && tamanhoAtual > 2) {
          el.style.setProperty(
            'font-size',
            (tamanhoAtual - 2) + 'px',
            'important'
          );
        }
      });

    }

    /* TEMA */
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }
    
    document.body.classList.toggle('light');
    document.getElementById('theme-toggle')
  .addEventListener('click', toggleTheme);

    /* CONTRASTE */
    function toggleContrast() {

      document.body.classList.toggle('high-contrast');

    }

    /* LEITOR */
    function readPage() {
      speechSynthesis.cancel();
      let text = '';
      const elements =
        document.querySelectorAll(
          'h1, h2, h3, p, label, a'
        );

      elements.forEach(element => {
        text += element.innerText + '. ';
      });

      const speech =
        new SpeechSynthesisUtterance(text);

      speech.lang = 'pt-BR';

      window.speechSynthesis.speak(speech);

    }
  </script>

    <script>
        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", verificar_campos);

        function verificar_campos(event){
            event.preventDefault();
            const nome = document.getElementById("nome").value;
            const telefone = document.getElementById("telefone").value;
            const usuario = document.getElementById("email").value;
            const cidade = document.getElementById("cidade").value;
            const curso = document.getElementById("curso").value;
            const turno = document.getElementById("turno").value;
            const termos = document.getElementById("termos").checked;

            if(
                nome.trim() === "" ||
                telefone.trim() === "" ||
                usuario.trim() === "" ||
                cidade.trim() === "" ||
                curso === "" ||
                turno.trim() === "" ||
                !termos
            ){
                Swal.fire({
                    title: 'Erro!',
                    text: 'Preencha todos os campos corretamente!',
                    icon: 'error'
                });
            } else {

                Swal.fire({
                    title: 'Sucesso!',
                    text: 'Cadastro realizado com sucesso!',
                    icon: 'success'
                });

                formulario.reset();
            }
       }
    </script>


    <script src="https://unpkg.com/imask"></script>

<script>
    const telefoneInput = document.getElementById('telefone');
    const cpfInput = document.getElementById('cpf');

    IMask(telefoneInput, {
        mask: [
            {
                mask: '(00) 0000-0000' // telefone fixo
            },
            {
                mask: '(00) 00000-0000' // celular
            }
        ]
    });

    IMask(cpfInput, {
        mask: '000.000.000-00'
    });

    function mostrarErro(titulo, mensagem) {
        Swal.fire({
            icon: "error",
            title: titulo,
            text: mensagem,
        });
    }

    document.getElementById('formulario').addEventListener('submit',
        function (event) {

            const telefone = telefoneInput.value.trim();
            const cpf = cpfInput.value.trim();
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const dataNascimento = document.getElementById('data_nascimento').value.trim();

            const cpfNumeros = cpf.replace(/\D/g, '');
            const telefoneNumeros = telefone.replace(/\D/g, '');

            if (nome.length < 3) {
                event.preventDefault();
                mostrarErro('Nome inválido', 'Informe o nome completo!');
                return;
            }

            // email tem que ter @
            if (!email.includes('@') || !email.includes('.')) {
                event.preventDefault();
                mostrarErro('Email inválido', 'Informe um email válido!');
                return;
            }

            // telefone deve ter 10 ou 11 dígitos
            if (telefoneNumeros.length < 10 || telefoneNumeros.length > 11) {
                event.preventDefault();
                mostrarErro('Telefone inválido', 'Informe um telefone válido!');
                return;
            }

            // CPF deve ter 11 dígitos
            if (cpfNumeros.length !== 11) {
                event.preventDefault();
                mostrarErro('CPF inválido', 'Informe um CPF válido!');
                return;
            }

            // data de nascimento
            const nascimento = new Date(dataNascimento);
            const hoje = new Date();

            hoje.setHours(0, 0, 0, 0);
            nascimento.setHours(0, 0, 0, 0);

            if (!dataNascimento || nascimento >= hoje) {
                event.preventDefault();
                mostrarErro(
                    'Data de nascimento inválida',
                    'Informe uma data correta'
                );
                return;
            }
        }
    );
</script>
